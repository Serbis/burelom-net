[workspace]
resolver = "2"
members = ["burelom-net", "burelom-net-emulator"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
defmt = "1.1.1"
log = "0.4.34"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = { version = "1.0", default-features = false }
async-trait = "0.1.92"
const-hex = { version = "1.19.3", features=["alloc", "hex"], default-features = false }
prost = { version = "0.14", default-features = false }
prost-types = { version = "0.14", default-features = false }
bon = {version = "3.10.1", default-features = false }
enumset = "1.1.14"
async-channel = { version = "2.5.0", default-features = false}

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
overflow-checks = true

[profile.dev]
opt-level = 1
